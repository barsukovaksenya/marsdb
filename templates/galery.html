{% extends "base.html" %}

{% block content %}
<div class="mt-4 text-center">
    <h2>Пейзажи Марса</h2>

    {% if images %}
    <div id="mars" class="carousel slide" data-ride="carousel"
         data-interval="3000">
        <ol class="carousel-indicators">
            {% for img in images %}
            <li data-target="#mars" data-slide-to="{{ loop.index0 }}"
                {% if loop.first %}class="active"{% endif %}></li>
            {% endfor %}
        </ol>
        <div class="carousel-inner">
            {% for img in images %}
            <div class="carousel-item {% if loop.first %}active{% endif %}">
                <img src="{{ url_for('static', filename='gallery/' + img) }}"
                     class="d-block w-100" alt="{{ img }}"
                     style="max-height: 500px; object-fit: cover;">
            </div>
            {% endfor %}
        </div>
        <a class="carousel-control-prev" href="#mars"
           role="button" data-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </a>
        <a class="carousel-control-next" href="#mars"
           role="button" data-slide="next">
            <span class="carousel-control-next-icon"></span>
        </a>
    </div>
    {% else %}
    <p>Пока нет изображений. Загрузите первое!</p>
    {% endif %}

    <div class="mt-4 text-left">
        <form action="/galery" method="post"
              enctype="multipart/form-data">
            <div class="form-group">
                <label>Добавить картинку</label><br>
                <input type="file" name="file" accept="image/*">
            </div>
            <button type="submit" class="btn btn-primary">
                Отправить
            </button>
        </form>
    </div>
</div>
{% endblock %}

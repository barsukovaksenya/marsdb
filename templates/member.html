{% extends "base.html" %}

{% block content %}
<div class="mt-4 text-center">
    <h2>{{ member.name }} {{ member.surname }}</h2>
    <img src="{{ member.photo }}" alt="фото"
         style="max-height: 400px;" class="mt-3">
    <p class="mt-4 h5">
        {{ member.specialties | sort | join(', ') }}
    </p>
</div>
{% endblock %}

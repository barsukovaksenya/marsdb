<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Миссия Колонизация Марса</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #f8f8f8;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
        }
        .subtitle {
            color: #bbb;
            font-style: italic;
            padding: 10px 20px;
        }
        .content {
            padding: 10px 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 20px;
        }
        th {
            background-color: #f8c8dc;
            padding: 8px 12px;
            text-align: left;
            border: 1px solid #ddd;
        }
        td {
            padding: 8px 12px;
            border: 1px solid #ddd;
        }
        tr:nth-child(even) {
            background-color: #fff0f5;
        }
        .not-finished {
            background-color: #ffe0eb;
            color: #c0392b;
        }
        .finished {
            background-color: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <header>
        <h1>Миссия Колонизация Марса</h1>
        <span>Mars One</span>
    </header>
    <div class="subtitle">И на Марсе будут яблони цвести!</div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
